<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0d0c" />
  <title>Cuadra</title>
  <meta name="description" content="Cuadra tus cuentas, tarjetas, efectivo, deudas y cortes con tu pareja." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cuadra" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- ============ BIENVENIDA ============ -->
  <div id="welcome" class="welcome hidden">
    <div class="w-inner">
      <div class="logo"><span class="lg-mark"></span><b>Cuadra</b></div>
      <p class="w-tag">Tus tarjetas, efectivo y deudas, siempre cuadrados.<br/>Cortes con tu pareja, gastos de casa y metas.</p>
      <label class="field"><span class="lbl">¿Cómo te llamas?</span><input id="wName" type="text" placeholder="Fer" autocomplete="given-name" /></label>
      <label class="field"><span class="lbl">Tu pareja (opcional)</span><input id="wPartner" type="text" placeholder="Liz" /></label>
      <button id="wStart" class="btn primary full">Empezar</button>
      <label class="btn ghost full">Ya tengo un respaldo (.json)<input id="wImport" type="file" accept=".json,application/json" hidden /></label>
      <p class="fine center">Tus datos se guardan solo en este teléfono.</p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hidden">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="content">
      <header class="topbar">
        <button id="back" class="icon-btn hidden" aria-label="Atrás"></button>
        <h1 id="title">Cuadra</h1>
        <div id="headAction"></div>
      </header>
      <main id="main"></main>
    </div>
    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div id="sheetRoot" class="sheet-root"></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
