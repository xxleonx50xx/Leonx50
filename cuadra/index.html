<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050807" />
  <title>Cuadra</title>
  <meta name="description" content="Cuadra tus cuentas, tarjetas, efectivo, deudas y cortes con tu pareja." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cuadra" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- ============ BIENVENIDA ============ -->
  <div id="welcome" class="welcome hidden">
    <div class="w-inner">
      <div class="logo"><span class="lg-mark"></span><b>Cuadra</b></div>
      <p class="w-tag">Cuadra tus tarjetas, efectivo y deudas.<br/>Cortes con tu pareja, fondo común y metas de ahorro.</p>
      <label class="field"><span class="lbl">¿Cómo te llamas?</span><input id="wName" type="text" placeholder="Fer" autocomplete="given-name" /></label>
      <label class="field"><span class="lbl">Tu pareja (opcional)</span><input id="wPartner" type="text" placeholder="Liz" /></label>
      <button id="wStart" class="btn primary full">Empezar</button>
      <label class="btn ghost full">Ya tengo un respaldo (.json)<input id="wImport" type="file" accept=".json,application/json" hidden /></label>
      <p class="fine center">Tus datos se guardan solo en este teléfono.</p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="hidden">
    <header class="topbar">
      <button id="back" class="icon-btn hidden" aria-label="Atrás">‹</button>
      <h1 id="title">Cuadra</h1>
      <div id="headAction"></div>
    </header>
    <main id="main"></main>
    <nav class="tabbar">
      <a href="#/inicio" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
      <a href="#/cuentas" data-tab="cuentas"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19M6 15h4"/></svg><span>Cuentas</span></a>
      <button id="fab" class="fab" aria-label="Registrar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <a href="#/personas" data-tab="personas"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.2 3.2 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg><span>Personas</span></a>
      <a href="#/mas" data-tab="mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Más</span></a>
    </nav>
  </div>

  <div id="sheetRoot" class="sheet-root"></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
