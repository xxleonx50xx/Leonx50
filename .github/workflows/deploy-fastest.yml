name: Deploy Fastest + Cuadra (PWAs) to GitHub Pages

on:
  push:
    branches: [main, master, claude/fastest-speed-tracker-app-im0u4f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Fastest queda en la raíz del sitio (misma URL de siempre)
      # y Cuadra se publica en /cuadra/
      - name: Build site
        run: |
          mkdir -p _site
          cp -r fastest/. _site/
          mkdir -p _site/cuadra
          cp -r cuadra/. _site/cuadra/
          rm -f _site/icons/gen-icons.mjs _site/cuadra/icons/gen-icons.mjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
